name: Polymarket US Discord Alerts

on:
  schedule:
    # Every five minutes (GitHub's scheduled starts can be delayed).
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get bot files
        uses: actions/checkout@v4

      - name: Verify scanner files and webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -f market_alerts.py || { echo 'market_alerts.py missing'; exit 1; }
          test -f scanner_plus.py || { echo 'scanner_plus.py missing'; exit 1; }
          test -n "$DISCORD_WEBHOOK_URL" || { echo 'DISCORD_WEBHOOK_URL secret missing'; exit 1; }
          python3 -m py_compile market_alerts.py scanner_plus.py

      - name: Apply V3.4 scanner upgrade
        run: |
          python3 upgrade_v34.py
          python3 -m py_compile market_alerts.py scanner_plus.py
          python3 test_v33.py

      - name: Scan markets (research only, NO trades)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          FLAGS='--max-pages 5 --max-bbo 25 --min-volume 0 --max-spread 0.08 --digest-hours 6'
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            python3 scanner_plus.py $FLAGS --report-now
          else
            python3 scanner_plus.py $FLAGS
          fi

      - name: Save samples and avoid duplicate alerts
        run: |
          test -f state.json || { echo 'state.json missing after scan'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Save Polymarket alert state [skip ci]'
            git push
          fi
